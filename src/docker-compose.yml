

services:
  mariadb:
    container_name: mariadb
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb-image
 #   restart: unless-stopped
    restart: no
    environment:
      - MYSQL_DIR=${MYSQL_DIR}
      - MARIADB_PORT=${MARIADB_PORT}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_ROOT=${MYSQL_ROOT}
    networks:
      - inception-network
    volumes:
      - db-data:/var/lib/mysql
    expose:
      - "${MARIADB_PORT}"
    secrets:
      - db_password
      - db_root_password
#
  wordpress:
    container_name: wordpress
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    args:
      PHP_VERSION: ${PHP_VERSION}
    environment:
      - WP_DB=${MYSQL_DATABASE}
      - WP_TITLE=${WP_TITLE}
      - WP_DB_USER=${MYSQL_USER}
      - WP_DB_ADMIN=${MYSQL_ROOT}
      - WP_HOST=${WP_HOST}
      - WP_CHARSET=${WP_CHARSET}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - PHP_VERSION=${PHP_VERSION}
      - WP_PREFIX=${WP_PREFIX}
      - MARIADB_PORT=${MARIADB_PORT}
    image: wordpress-image
    #restart: unless-stopped
    restart: no
		
    depends_on:
      - mariadb
    networks:
      - inception-network
    expose:
      - "${WP_PORT}"
    volumes:
      - wp-data:/var/www/html
    secrets:
      - db_password
      - db_root_password

  nginx:
    container_name: nginx
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    environment:
      - NGINX_BDIR=${NGINX_BDIR}
      - SSL_PATH=${SSL_PATH}
      - NGINX_LOGDIR=${NGINX_LOGDIR}
      - NGINX_PORT=${NGINX_PORT}
      - DOMAIN_NAME=${DOMAIN_NAME}
    image: nginx-image
    #restart: unless-stopped
    restart: no
    ports:
      - "${NGINX_PORT}:${NGINX_PORT}"
    depends_on:
      - wordpress
    networks:
      - inception-network # nombre del network
    volumes:
      - wp-data:/var/www/html

networks:
  inception-network:
    driver: bridge

volumes:
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/israetor/data/mariadb
  wp-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/israetor/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
 # credentials:
 #   file: ../secrets/credentials.txt

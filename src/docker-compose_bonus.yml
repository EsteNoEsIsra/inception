
services:
		redis:
			container_name: redis
			build: 
			 context: ./requirements/bonus/redis
       dockerfile: Dockerfile
			image: redis-image
			environment:
				- REDIS_PORT=${REDIS_PORT}
			restart: unless-stopped
			networks:
			 - inception_network
			expose:
			 - "${REDIS_PORT}"
	adminer:
			container_name: adminer
			build: 
			 context: ./requirements/bonus/adminer
       dockerfile: Dockerfile
			image: adminer-image
			args:
				PHP_VERSION: ${PHP_VERSION}
			environment:
				- ADMINER_PORT=${ADMINER_PORT}
				- ADMINER_VERSION=${ADMINER_VERSION}
				- MARIADB_PORT=${MARIADB_PORT}
				- PHP_VERSION=${PHP_VERSION}
			restart: unless-stopped
			volumes:
				- wp:/var/www/html
			networks:
			 - inception_network
			expose:
			 - "${ADMINER_PORT}"
	
	vsftpd:
			container_name: vsftpd
			build: 
			 context: ./requirements/bonus/vsftpd
       dockerfile: Dockerfile
			image: vsftpd-image
			environment:
        - VSFTPD_DATA_PORT=${VSFTPD_DATA_PORT}
				- VSFTPD_PORT=${VSFTPD_PORT}
				- VSFTPD_USER=${VSFTPD_USER}
				- VSFTPD_PASS=/run/secrets/ftp_password
			restart: unless-stopped
			secrets:
				- ftp_password.txt
			networks:
			 - inception_network
			expose:
			 - "${VSFTPD_PORT}":"${VSFTPD_PORT}"
			 - "20:20"
 			 - "5000-5010:5000-5010"
			volumes:
				-wp:/home/${VSFTPD_USER}/ftp/files
	website:
  	container_name: website
  	build: 
			context: ./requirements/bonus/website
			dockerfile: Dockerfile
		image: website-image
  	expose:
    	- "80"
  	networks:
    - inception-network
